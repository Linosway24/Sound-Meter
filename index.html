<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest SoundPro SE-DL Simulation</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="device-stage" role="presentation">
        <div class="device-frame" aria-label="Quest SoundPro SE-DL device" role="img">
            <img
                class="device-photo"
                src="assets/Quest Sound Meter.png"
                alt="Quest SoundPro SE-DL device photograph serving as the full device face"
                draggable="false"
            >

            <!-- Absolute overlay layer anchored to the device photo -->
            <div class="overlay-layer">
                <!-- LCD overlay region -->
                <section class="lcd lcd--powered-off testing-overlay" aria-label="LCD display" aria-live="polite">
                    <div class="lcd__status"></div>
                    <div class="lcd__main"></div>
                    <div class="lcd__softkeys"></div>
                </section>

                <!-- Soft keys 1–4 (top to bottom or left to right depending on device) -->
                <button class="soft-key soft-key--1 testing-overlay" type="button" aria-label="Soft Key 1"></button>
                <button class="soft-key soft-key--2 testing-overlay" type="button" aria-label="Soft Key 2"></button>
                <button class="soft-key soft-key--3 testing-overlay" type="button" aria-label="Soft Key 3"></button>
                <button class="soft-key soft-key--4 testing-overlay" type="button" aria-label="Soft Key 4"></button>

                <!-- Navigation buttons: Up/Down/Left/Right/Enter -->
                <button class="nav__btn nav__btn--up testing-overlay" type="button" aria-label="Up"></button>
                <button class="nav__btn nav__btn--down testing-overlay" type="button" aria-label="Down"></button>
                <button class="nav__btn nav__btn--left testing-overlay" type="button" aria-label="Left"></button>
                <button class="nav__btn nav__btn--right testing-overlay" type="button" aria-label="Right"></button>
                <button class="nav__btn nav__btn--enter testing-overlay" type="button" aria-label="Enter"></button>

                <!-- Function buttons: Alt f, Backlight, Run/Pause, Stop, On/Off -->
                <button class="fn-btn fn-btn--altf testing-overlay" type="button" aria-label="Alt f"></button>
                <button class="fn-btn fn-btn--backlight testing-overlay" type="button" aria-label="Backlight"></button>
                <button class="fn-btn fn-btn--runpause testing-overlay" type="button" aria-label="Run or Pause"></button>
                <button class="fn-btn fn-btn--stop testing-overlay" type="button" aria-label="Stop"></button>
                <button class="fn-btn fn-btn--power testing-overlay" type="button" aria-label="On Off"></button>

                <!-- Dialog overlay (hidden by default) -->
                <div id="dialog-overlay" class="dialog-overlay" aria-hidden="true" role="dialog" aria-modal="true">
                    <div class="dialog" role="document">
                        <header class="dialog__header">
                            <h2 class="dialog__title">Notice</h2>
                        </header>
                        <div class="dialog__body">
                            <p>Dialog content goes here.</p>
                        </div>
                        <footer class="dialog__footer">
                            <button class="dialog__btn dialog__btn--confirm" type="button">OK</button>
                            <button class="dialog__btn dialog__btn--cancel" type="button">Cancel</button>
                        </footer>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Audio Control Panel -->
    <div id="audio-panel" class="audio-panel">
        <div class="audio-panel__header">
            <span class="audio-panel__title">🔊 Sound Simulator</span>
            <button class="audio-panel__toggle" onclick="toggleAudioPanel()">−</button>
        </div>
        <div class="audio-panel__content">
            <div class="audio-panel__section">
                <div class="audio-panel__label">Steady Sounds</div>
                <button class="audio-btn" onclick="window.Audio.playPreset('fan')">🌀 Fan</button>
                <button class="audio-btn" onclick="window.Audio.playPreset('engine')">🚗 Engine</button>
                <button class="audio-btn" onclick="window.Audio.playPreset('office')">🏢 Office</button>
            </div>
            <div class="audio-panel__section">
                <div class="audio-panel__label">Intermittent Sounds</div>
                <button class="audio-btn" onclick="window.Audio.playPreset('hammering')">🔨 Hammering</button>
                <button class="audio-btn" onclick="window.Audio.playPreset('clapping')">👏 Clapping</button>
            </div>
            <div class="audio-panel__section">
                <div class="audio-panel__label">Industrial</div>
                <button class="audio-btn" onclick="window.Audio.playPreset('machinery')">⚙️ Machinery</button>
            </div>
            <div class="audio-panel__section">
                <div class="audio-panel__label">Calibration</div>
                <button class="audio-btn audio-btn--calibration" onclick="window.Audio.playPreset('calibration')">🎵 1kHz Tone</button>
            </div>
            <div class="audio-panel__controls">
                <button class="audio-btn audio-btn--stop" onclick="window.Audio.stop()">⏹ Stop</button>
                <div class="audio-panel__volume">
                    <label>Vol:</label>
                    <input type="range" min="0" max="100" value="50" onchange="window.Audio.setVolume(this.value/100)">
                </div>
            </div>
            <div class="audio-panel__status" id="audio-status">Ready</div>
        </div>
    </div>

    <script>
        function toggleAudioPanel() {
            const panel = document.getElementById('audio-panel');
            const content = panel.querySelector('.audio-panel__content');
            const toggle = panel.querySelector('.audio-panel__toggle');
            if (content.style.display === 'none') {
                content.style.display = 'block';
                toggle.textContent = '−';
            } else {
                content.style.display = 'none';
                toggle.textContent = '+';
            }
        }
    </script>

    <!-- Core modules (Task 2.0) -->
    <script src="js/utils.js"></script>
    <script src="js/config.js"></script>
    <script src="js/simulator.js"></script>
    <script src="js/measurement.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/device.js"></script>
    <script src="js/display.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/buttons.js"></script>
    
    <!-- FSM integration -->
    <script src="js/screen-renderer.js"></script>
    <!-- FSM will be loaded conditionally in initializeApp -->
    
    <!-- Development/debugging scripts -->
    <script src="js/measure-photo.js"></script>
    <script src="js/viewport-size-indicator.js"></script>
    <script src="js/fix-percentages.js"></script>
    <script src="js/recalculate-percentages.js"></script>
    <script src="js/debug-positioning.js"></script>
    
    <!-- Initialize application -->
    <script>
        async function initializeApp() {
            // Initialize display module first (sets up lcdMain, lcdStatus, etc.)
            if (window.renderDisplay) {
                // renderDisplay will call init() internally if needed
                // But we need to ensure display is initialized
                const lcdMain = document.querySelector('.lcd__main');
                if (!lcdMain) {
                    console.error('[INIT] LCD main element not found in DOM');
                } else {
                    console.log('[INIT] LCD main element found');
                }
            }
            
            // Initialize screen renderer first (loads screen-atlas.json)
            if (window.initScreenRenderer) {
                await window.initScreenRenderer();
            }
            
            // Load mainFSM (production FSM)
            const fsmScript = document.createElement('script');
            fsmScript.src = 'js/fsm/mainFSM.js';
            fsmScript.onload = function() {
                // Initialize mainFSM
                if (window.initMainFSM) {
                    window.initMainFSM();
                }
                
                // Subscribe display to FSM state changes
                console.log('[INIT] Checking subscription setup...');
                console.log('[INIT] window.subscribeMainFSM:', !!window.subscribeMainFSM);
                console.log('[INIT] window.renderScreen:', !!window.renderScreen);
                if (window.subscribeMainFSM && window.renderScreen) {
                    console.log('[INIT] Setting up subscription...');
                    const unsubscribe = window.subscribeMainFSM((state) => {
                        try {
                            // #region agent log
                            fetch('http://127.0.0.1:7242/ingest/d29d041b-3e2f-4de6-8d28-ee7a100756fa',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'index.html:122',message:'subscription callback entry',data:{viewId:state.viewId},timestamp:Date.now(),sessionId:'debug-session',runId:'run1',hypothesisId:'E'})}).catch(()=>{});
                            // #endregion
                            console.log('[SUBSCRIBE] State changed, viewId:', state.viewId);
                            // Update LCD power state CSS classes
                            const lcd = document.querySelector('.lcd');
                            if (lcd) {
                                if (state.viewId === 'OFF') {
                                    lcd.classList.add('lcd--powered-off');
                                } else {
                                    lcd.classList.remove('lcd--powered-off');
                                }
                            }
                            
                            // Handle OFF state - clear display
                            if (state.viewId === 'OFF') {
                                if (window.updateMainArea) {
                                    window.updateMainArea('');
                                }
                                if (window.updateStatusArea) {
                                    window.updateStatusArea('');
                                }
                                if (window.updateSoftKeyLabels) {
                                    window.updateSoftKeyLabels(['', '', '', '']);
                                }
                                if (window.updateDisplayBacklightState) {
                                    window.updateDisplayBacklightState(false);
                                }
                                // Hide toast when off
                                if (window.hideToast) {
                                    window.hideToast();
                                }
                                return; // Don't render anything when OFF
                            }
                            
                            // Render by viewId
                            if (window.renderScreen) {
                                // #region agent log
                                fetch('http://127.0.0.1:7242/ingest/d29d041b-3e2f-4de6-8d28-ee7a100756fa',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'index.html:157',message:'subscription callback renderScreen',data:{viewId:state.viewId},timestamp:Date.now(),sessionId:'debug-session',runId:'run1',hypothesisId:'E'})}).catch(()=>{});
                                // #endregion
                                console.log('[SUBSCRIBE] Rendering screen:', state.viewId);
                                const rendered = window.renderScreen(state.viewId, state);
                                // #region agent log
                                fetch('http://127.0.0.1:7242/ingest/d29d041b-3e2f-4de6-8d28-ee7a100756fa',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'index.html:160',message:'subscription renderScreen result',data:{viewId:state.viewId,mainHTMLLength:rendered?.mainHTML?.length||0},timestamp:Date.now(),sessionId:'debug-session',runId:'run1',hypothesisId:'E'})}).catch(()=>{});
                                // #endregion
                                console.log('[SUBSCRIBE] Rendered HTML length:', rendered.mainHTML ? rendered.mainHTML.length : 0);
                                console.log('[SUBSCRIBE] Rendered HTML preview:', rendered.mainHTML ? rendered.mainHTML.substring(0, 200) : 'null');
                                
                                // Check if display functions are available
                                if (!window.updateMainArea) {
                                    console.error('[SUBSCRIBE] window.updateMainArea is not available!');
                                }
                                if (!window.updateStatusArea) {
                                    console.error('[SUBSCRIBE] window.updateStatusArea is not available!');
                                }
                                if (!window.updateSoftKeyLabels) {
                                    console.error('[SUBSCRIBE] window.updateSoftKeyLabels is not available!');
                                }
                                
                                if (window.updateMainArea) {
                                    console.log('[SUBSCRIBE] Calling updateMainArea...');
                                    window.updateMainArea(rendered.mainHTML);
                                }
                                // Update status area with rendered content first
                                if (window.updateStatusArea) {
                                    window.updateStatusArea(rendered.statusHTML || '');
                                }
                                if (window.updateSoftKeyLabels) {
                                    window.updateSoftKeyLabels(rendered.softkeys);
                                }
                            } else {
                                console.error('[SUBSCRIBE] window.renderScreen is not available!');
                            }
                            
                            // Set backlight state
                            if (window.updateDisplayBacklightState) {
                                window.updateDisplayBacklightState(state.backlight);
                            }
                            // Render toast if present
                            if (window.renderToast && state.toast) {
                                window.renderToast(state.toast);
                            } else if (window.hideToast) {
                                window.hideToast();
                            }
                            
                            // Debug: Show selected index in status area (temporary until highlighting is implemented)
                            // Only add debug text if statusHTML is empty (so it doesn't overwrite actual content)
                            if (window.updateStatusArea) {
                                const statusEl = document.querySelector('.lcd__status');
                                if (statusEl && (state.viewId === 'home_screen' || state.viewId === 'home_screen_dim' || 
                                    state.viewId === 'setup_menu' || state.viewId === 'files_menu' || state.viewId === 'slm_view_menu')) {
                                    // Only show debug text if status area is empty (no actual status content)
                                    const hasStatusContent = statusEl.innerHTML.trim().length > 0;
                                    if (!hasStatusContent) {
                                        const menuItems = state.viewId === 'home_screen' || state.viewId === 'home_screen_dim' ? 
                                            ['VIEW PAST STUDIES', 'VIEW CURRENT STUDY', 'VIEW SESSION', 'SETUP', 'UNIT INFO'] :
                                            state.viewId === 'setup_menu' ? 
                                            ['METER SET', 'MEASURE', 'AUTO RUN', 'DATETIME', 'DIGITAL OUT', 'OPTIONS', 'SIG INPUT', 'LOGGING', 'COMMS', 'BATTERY', 'DISPLAY'] :
                                            state.viewId === 'files_menu' ?
                                            ['SESSION DIRECTORY', 'CONFIG DIRECTORY', 'RENAME LAST SESSION', 'SAVE CONFIG FILE', 'FORMAT CARD'] :
                                            ['VIEW PAST STUDIES', 'VIEW CURRENT STUDY', 'VIEW SESSION'];
                                        const selectedItem = menuItems[state.menu.selectedIndex] || 'N/A';
                                        statusEl.innerHTML = `<span style="font-size: 10px; opacity: 0.7;">[${state.menu.selectedIndex}] ${selectedItem}</span>`;
                                    }
                                }
                            }
                        } catch (error) {
                            console.error('[SUBSCRIBE] Error in subscription callback:', error);
                        }
                    });
                }
                
                // Initialize button handlers
                if (window.initButtons) {
                    window.initButtons();
                }
                
                // Trigger initial render after everything is set up
                // The subscription callback should fire automatically, but ensure initial state is rendered
                if (window.getMainFSMState) {
                    const initialState = window.getMainFSMState();
                    // #region agent log
                    fetch('http://127.0.0.1:7242/ingest/d29d041b-3e2f-4de6-8d28-ee7a100756fa',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'index.html:235',message:'initial state check',data:{viewId:initialState.viewId,hasRenderScreen:!!window.renderScreen,hasUpdateMainArea:!!window.updateMainArea},timestamp:Date.now(),sessionId:'debug-session',runId:'run1',hypothesisId:'E'})}).catch(()=>{});
                    // #endregion
                    console.log('[INIT] Initial state viewId:', initialState.viewId);
                    
                    // Manually trigger render for initial state (in case subscription didn't fire)
                    const lcd = document.querySelector('.lcd');
                    if (lcd) {
                        if (initialState.viewId === 'OFF') {
                            lcd.classList.add('lcd--powered-off');
                        } else {
                            lcd.classList.remove('lcd--powered-off');
                        }
                    }
                    
                    if (initialState.viewId !== 'OFF' && window.renderScreen) {
                        // #region agent log
                        fetch('http://127.0.0.1:7242/ingest/d29d041b-3e2f-4de6-8d28-ee7a100756fa',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'index.html:248',message:'initial render calling renderScreen',data:{viewId:initialState.viewId},timestamp:Date.now(),sessionId:'debug-session',runId:'run1',hypothesisId:'E'})}).catch(()=>{});
                        // #endregion
                        const rendered = window.renderScreen(initialState.viewId, initialState);
                        // #region agent log
                        fetch('http://127.0.0.1:7242/ingest/d29d041b-3e2f-4de6-8d28-ee7a100756fa',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'index.html:250',message:'initial render result',data:{viewId:initialState.viewId,mainHTMLLength:rendered?.mainHTML?.length||0,hasUpdateMainArea:!!window.updateMainArea},timestamp:Date.now(),sessionId:'debug-session',runId:'run1',hypothesisId:'E'})}).catch(()=>{});
                        // #endregion
                        if (window.updateMainArea) window.updateMainArea(rendered.mainHTML);
                        if (window.updateStatusArea) window.updateStatusArea(rendered.statusHTML || '');
                        if (window.updateSoftKeyLabels) window.updateSoftKeyLabels(rendered.softkeys);
                    } else if (initialState.viewId === 'OFF') {
                        if (window.updateMainArea) window.updateMainArea('');
                        if (window.updateStatusArea) window.updateStatusArea('');
                        if (window.updateSoftKeyLabels) window.updateSoftKeyLabels(['', '', '', '']);
                    }
                    
                    if (window.updateDisplayBacklightState) {
                        window.updateDisplayBacklightState(initialState.backlight || false);
                    }
                }
            };
            document.head.appendChild(fsmScript);
        }
        
        // Handle window resize - ensure overlays stay aligned
        let resizeFrameId = null;
        function handleResize() {
            if (resizeFrameId !== null) {
                cancelAnimationFrame(resizeFrameId);
            }
            // Use requestAnimationFrame to ensure recalculation happens after browser layout
            resizeFrameId = requestAnimationFrame(() => {
                resizeFrameId = null;
                // Force browser to recalculate layout
                const deviceFrame = document.querySelector('.device-frame');
                const devicePhoto = document.querySelector('.device-photo');
                const overlayLayer = document.querySelector('.overlay-layer');
                
                if (deviceFrame && devicePhoto && overlayLayer) {
                    // Force reflow by reading dimensions - this ensures percentages recalculate
                    void deviceFrame.offsetWidth;
                    void deviceFrame.offsetHeight;
                    void devicePhoto.offsetWidth;
                    void devicePhoto.offsetHeight;
                    void overlayLayer.offsetWidth;
                    void overlayLayer.offsetHeight;
                }
                
                // Re-render using current FSM state (don't use renderDisplay as it uses old logic)
                if (window.getMainFSMState && window.renderScreen) {
                    const state = window.getMainFSMState();
                    if (state && state.viewId !== 'OFF') {
                        const rendered = window.renderScreen(state.viewId, state);
                        if (window.updateMainArea) window.updateMainArea(rendered.mainHTML);
                        if (window.updateStatusArea) window.updateStatusArea(rendered.statusHTML);
                        if (window.updateSoftKeyLabels) window.updateSoftKeyLabels(rendered.softkeys);
                    }
                }
            });
        }
        
        window.addEventListener('resize', handleResize);
        // Also handle orientation change
        window.addEventListener('orientationchange', handleResize);
        
        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            initializeApp();
        }
    </script>
</body>
</html>
