<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest SoundPro SE-DL Simulation</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Zoom Control Panel -->
    <div id="zoom-control" class="zoom-control">
        <div class="zoom-control__header">
            <span class="zoom-control__title">🔍 Zoom</span>
        </div>
        <div class="zoom-control__content">
            <div class="zoom-control__slider-container">
                <input 
                    type="range" 
                    id="zoom-slider" 
                    class="zoom-control__slider" 
                    min="0" 
                    max="200" 
                    value="0" 
                    step="5"
                    oninput="window.setDeviceZoom(this.value)"
                >
                <div class="zoom-control__labels">
                    <span>0%</span>
                    <span id="zoom-value">0%</span>
                    <span>200%</span>
                </div>
            </div>
            <div class="zoom-control__buttons">
                <button class="zoom-btn" onclick="window.setDeviceZoom(0)">Reset</button>
                <button class="zoom-btn" onclick="window.zoomIn()">+</button>
                <button class="zoom-btn" onclick="window.zoomOut()">−</button>
            </div>
        </div>
    </div>

    <!-- Dosimeter Snap Coordinates Control Panel -->
    <div id="dosimeter-snap-control" class="dosimeter-snap-control">
        <div class="dosimeter-snap-control__header">
            <span class="dosimeter-snap-control__title">📍 Dosimeter Snap</span>
        </div>
        <div class="dosimeter-snap-control__content">
            <div class="dosimeter-snap-control__current">
                <div class="dosimeter-snap-control__label">Current Position:</div>
                <div id="dosimeter-current-pos" class="dosimeter-snap-control__value">X: 0, Y: 0</div>
            </div>
            <div class="dosimeter-snap-control__captured" id="dosimeter-captured-values" style="display: none;">
                <div class="dosimeter-snap-control__label">Captured Values:</div>
                <div id="dosimeter-captured-display" class="dosimeter-snap-control__value" style="font-size: 11px; word-break: break-all;"></div>
                <button class="dosimeter-snap-btn" onclick="window.copyCapturedValues()" style="margin-top: 4px; padding: 4px 8px; font-size: 11px;">Copy Values</button>
            </div>
            <div class="dosimeter-snap-control__inputs">
                <div class="dosimeter-snap-control__input-group">
                    <label>X Offset:</label>
                    <input type="number" id="dosimeter-snap-x" value="-20" step="1" onchange="window.applyDosimeterSnapCoords()" oninput="window.updateDosimeterSnapPreview()">
                </div>
                <div class="dosimeter-snap-control__input-group">
                    <label>Y Offset:</label>
                    <input type="number" id="dosimeter-snap-y" value="-166" step="1" onchange="window.applyDosimeterSnapCoords()" oninput="window.updateDosimeterSnapPreview()">
                </div>
                <div class="dosimeter-snap-control__input-group">
                    <label>Height Multiplier:</label>
                    <input type="number" id="dosimeter-snap-height-mult" value="0.5" step="0.1" onchange="window.applyDosimeterSnapCoords()" oninput="window.updateDosimeterSnapPreview()">
                </div>
            </div>
            <div class="dosimeter-snap-control__buttons">
                <button class="dosimeter-snap-btn" onclick="window.applyDosimeterSnapCoords()">Apply</button>
                <button class="dosimeter-snap-btn" onclick="window.forceSnapDosimeter()">Force Snap</button>
                <button class="dosimeter-snap-btn" onclick="window.captureCurrentDosimeterPos()">Capture</button>
            </div>
        </div>
    </div>

    <!-- Audio Control Panel -->
    <div id="audio-panel" class="audio-panel">
        <div class="audio-panel__header">
            <span class="audio-panel__title">🔊 Sound Simulator</span>
            <button class="audio-panel__toggle" onclick="toggleAudioPanel()">−</button>
        </div>
        <div class="audio-panel__content">
            <div class="audio-panel__section">
                <div class="audio-panel__label">Steady Sounds</div>
                <button class="audio-btn" onclick="window.AudioPlayer.playPreset('fan')">🌀 Fan</button>
                <button class="audio-btn" onclick="window.AudioPlayer.playPreset('engine')">🚗 Engine</button>
                <button class="audio-btn" onclick="window.AudioPlayer.playPreset('office')">🏢 Office</button>
            </div>
            <div class="audio-panel__section">
                <div class="audio-panel__label">Intermittent Sounds</div>
                <button class="audio-btn" onclick="window.AudioPlayer.playPreset('hammering')">🔨 Hammering</button>
                <button class="audio-btn" onclick="window.AudioPlayer.playPreset('clapping')">👏 Clapping</button>
            </div>
            <div class="audio-panel__section">
                <div class="audio-panel__label">Industrial</div>
                <button class="audio-btn" onclick="window.AudioPlayer.playPreset('machinery')">⚙️ Machinery</button>
            </div>
            <div class="audio-panel__section">
                <div class="audio-panel__label">Calibration</div>
                <button class="audio-btn audio-btn--calibration" onclick="window.AudioPlayer.playPreset('calibration')">🎵 1kHz Tone</button>
            </div>
            <div class="audio-panel__controls">
                <button class="audio-btn audio-btn--stop" onclick="window.AudioPlayer.stop()">⏹ Stop</button>
            </div>
            <div class="audio-panel__status" id="audio-status">Ready</div>
        </div>
    </div>

    <!-- Video Panel for Sound Presets -->
    <div id="sound-video-panel" class="sound-video-panel">
        <div class="sound-video-grid" id="sound-video-grid">
            <!-- Videos will be dynamically inserted here -->
        </div>
    </div>

    <script>
        function toggleAudioPanel() {
            const panel = document.getElementById('audio-panel');
            const content = panel.querySelector('.audio-panel__content');
            const toggle = panel.querySelector('.audio-panel__toggle');
            if (content.style.display === 'none') {
                content.style.display = 'block';
                toggle.textContent = '−';
            } else {
                content.style.display = 'none';
                toggle.textContent = '+';
            }
        }

        function stopAllVideos() {
            if (window.AudioPlayer) {
                window.AudioPlayer.stopAllVideos();
            }
        }

        // Dosimeter button press state
        let dosimeterPressState = {
            pressStart: null,
            holdTimer: null,
            holdThreshold: 500 // milliseconds
        };

        function updateDosimeterDisplay() {
            const dosimeterDisplay = document.getElementById('dosimeter-display');
            if (!dosimeterDisplay) return;
            
            // Check if calibration audio is currently playing
            const audioState = window.AudioPlayer?.getState?.();
            const isCalibrationPlaying = audioState?.isPlaying && 
                                        audioState.currentPresetName === 'calibration';
            
            // Show display only when calibration is actually playing, hide when stopped
            if (isCalibrationPlaying) {
                dosimeterDisplay.classList.add('dosimeter-display--on');
            } else {
                dosimeterDisplay.classList.remove('dosimeter-display--on');
            }
        }

        function toggleDosimeter() {
            // Check if calibration audio is currently playing
            const audioState = window.AudioPlayer?.getState?.();
            const isCalibrationPlaying = audioState?.isPlaying && 
                                        audioState.currentPresetName === 'calibration';
            
            if (isCalibrationPlaying) {
                // Stop calibration audio if it's playing
                window.AudioPlayer?.stop();
                // Hide display immediately when stopping
                updateDosimeterDisplay();
            } else {
                // Play calibration audio - display will show when audio actually starts (via polling)
                window.AudioPlayer?.playPreset('calibration');
            }
        }

        function handleDosimeterButtonDown() {
            dosimeterPressState.pressStart = Date.now();
            
            // Start hold timer - if held long enough, stop audio
            dosimeterPressState.holdTimer = setTimeout(() => {
                // Press and hold detected - stop audio
                window.AudioPlayer?.stop();
                dosimeterPressState.holdTimer = null;
                // Hide display immediately when stopping
                updateDosimeterDisplay();
            }, dosimeterPressState.holdThreshold);
        }

        function handleDosimeterButtonUp() {
            const pressDuration = dosimeterPressState.pressStart ? 
                Date.now() - dosimeterPressState.pressStart : 0;
            
            // Clear hold timer if it hasn't fired yet
            if (dosimeterPressState.holdTimer) {
                clearTimeout(dosimeterPressState.holdTimer);
                dosimeterPressState.holdTimer = null;
                
                // Quick press - toggle audio
                if (pressDuration < dosimeterPressState.holdThreshold) {
                    toggleDosimeter();
                }
            }
            
            dosimeterPressState.pressStart = null;
        }

        // Update dosimeter button position to scale with image (simplified - CSS percentages handle most of it)
        function updateDosimeterButtonPosition() {
            // CSS percentages should handle scaling automatically
            // This function ensures any inline styles are removed so CSS percentages take effect
            const dosimeterButton = document.querySelector('.dosimeter-btn--power');
            if (!dosimeterButton) return;
            
            // Remove any inline styles that might override CSS percentages
            // This ensures the button scales proportionally with the dosimeter container
            dosimeterButton.style.left = '';
            dosimeterButton.style.top = '';
            dosimeterButton.style.width = '';
            dosimeterButton.style.height = '';
        }

        // Initialize dosimeter button handlers after DOM is ready
        function initDosimeterButton() {
            const dosimeterButton = document.querySelector('.dosimeter-btn--power');
            if (!dosimeterButton) return;
            
            // Remove onclick handler - we'll handle it with event listeners
            dosimeterButton.removeAttribute('onclick');
            
            // Add press and hold handlers
            dosimeterButton.addEventListener('mousedown', handleDosimeterButtonDown);
            dosimeterButton.addEventListener('mouseup', handleDosimeterButtonUp);
            dosimeterButton.addEventListener('mouseleave', handleDosimeterButtonUp); // Handle mouse leaving button
            dosimeterButton.addEventListener('touchstart', handleDosimeterButtonDown);
            dosimeterButton.addEventListener('touchend', handleDosimeterButtonUp);
            dosimeterButton.addEventListener('touchcancel', handleDosimeterButtonUp); // Handle touch cancellation
            
            // Update button position when image loads and on resize
            updateDosimeterButtonPosition();
            window.addEventListener('resize', updateDosimeterButtonPosition);
            
            // Monitor audio state changes to update display
            // Check periodically for audio state changes (audio starts asynchronously)
            setInterval(updateDosimeterDisplay, 200);
            
            // Initial display state - ensure it starts blank
            const dosimeterDisplay = document.getElementById('dosimeter-display');
            if (dosimeterDisplay) {
                dosimeterDisplay.classList.remove('dosimeter-display--on');
            }
        }
    </script>

    <!-- Core modules (Task 2.0) -->
    <script src="js/utils.js"></script>
    <script src="js/config.js"></script>

    <script src="js/viewport-size-indicator.js"></script>

    <script src="js/recalculate-percentages.js"></script>

    <!-- Initialize application -->
    <script>
        async function initializeApp() {
            // Initialize display module first (sets up lcdMain, lcdStatus, etc.)
            if (window.renderDisplay) {
                // renderDisplay will call init() internally if needed
                // But we need to ensure display is initialized
                const lcdMain = document.querySelector('.lcd__main');
                if (!lcdMain) {
                    console.error('[INIT] LCD main element not found in DOM');
                } else {
                    console.log('[INIT] LCD main element found');
                }
            }
            
            // Initialize screen renderer first (loads screen-atlas.json)
            if (window.initScreenRenderer) {
                await window.initScreenRenderer();
            }
            
            // Load mainFSM (production FSM)
            const fsmScript = document.createElement('script');
            fsmScript.src = 'js/fsm/mainFSM.js';
            fsmScript.onload = function() {
                // Initialize mainFSM
                if (window.initMainFSM) {
                    window.initMainFSM();
                }
                
                // Update LCD font size after FSM initializes (wait a frame for layout)
                requestAnimationFrame(() => {
                    updateLCDFontSize();
                });
                
                // Subscribe display to FSM state changes
                console.log('[INIT] Checking subscription setup...');
                console.log('[INIT] window.subscribeMainFSM:', !!window.subscribeMainFSM);
                console.log('[INIT] window.renderScreen:', !!window.renderScreen);
                
                // Track previous viewId for auto-zoom detection
                let previousViewId = null;
                
                if (window.subscribeMainFSM && window.renderScreen) {
console.log('[INIT] Setting up subscription...');
                    const unsubscribe = window.subscribeMainFSM((state) => {
                        // Auto-zoom when boot screen appears (start zoom during boot for smoother effect)
                        if (previousViewId === 'OFF' && state.viewId === 'boot_screen') {
                            // Start zoom animation during boot screen - this keeps boot screen visible during zoom
                            setTimeout(() => {
                                autoZoomToLCD();
                            }, 150); // Small delay to ensure boot screen is rendered
                        }
                        previousViewId = state.viewId;
                        try {
                            // #region agent log
                            fetch('http://127.0.0.1:7242/ingest/d29d041b-3e2f-4de6-8d28-ee7a100756fa',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'index.html:122',message:'subscription callback entry',data:{viewId:state.viewId},timestamp:Date.now(),sessionId:'debug-session',runId:'run1',hypothesisId:'E'})}).catch(()=>{});
                            // #endregion
                            console.log('[SUBSCRIBE] State changed, viewId:', state.viewId);
                            // Update LCD power state CSS classes
                            const lcd = document.querySelector('.lcd');
                            if (lcd) {
                                if (state.viewId === 'OFF') {
                                    lcd.classList.add('lcd--powered-off');
                                    lcd.classList.remove('lcd--boot-screen');
                                } else {
                                    lcd.classList.remove('lcd--powered-off');
                                    // Add boot screen class for styling
                                    if (state.viewId === 'boot_screen') {
                                        lcd.classList.add('lcd--boot-screen');
                                    } else {
                                        lcd.classList.remove('lcd--boot-screen');
                                    }
                                    // Ensure LCD is visible when not OFF
                                    lcd.style.display = '';
                                    lcd.style.visibility = '';
                                    lcd.style.opacity = '';
                                }
                            }
                            
                            // Handle OFF state - clear display
                            if (state.viewId === 'OFF') {
                                if (window.updateMainArea) {
                                    window.updateMainArea('');
                                }
                                if (window.updateStatusArea) {
                                    window.updateStatusArea('');
                                }
                                if (window.updateSoftKeyLabels) {
                                    window.updateSoftKeyLabels(['', '', '', '']);
                                }
                                if (window.updateDisplayBacklightState) {
                                    window.updateDisplayBacklightState(false);
                                }
                                // Hide toast when off
                                if (window.hideToast) {
                                    window.hideToast();
                                }
                                return; // Don't render anything when OFF
                            }
                            
                            // Render by viewId
                            if (window.renderScreen) {
                                // #region agent log
                                fetch('http://127.0.0.1:7242/ingest/d29d041b-3e2f-4de6-8d28-ee7a100756fa',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'index.html:157',message:'subscription callback renderScreen',data:{viewId:state.viewId},timestamp:Date.now(),sessionId:'debug-session',runId:'run1',hypothesisId:'E'})}).catch(()=>{});
                                // #endregion
                                console.log('[SUBSCRIBE] Rendering screen:', state.viewId);
                                const rendered = window.renderScreen(state.viewId, state);
                                // #region agent log
                                fetch('http://127.0.0.1:7242/ingest/d29d041b-3e2f-4de6-8d28-ee7a100756fa',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'index.html:160',message:'subscription renderScreen result',data:{viewId:state.viewId,mainHTMLLength:rendered?.mainHTML?.length||0},timestamp:Date.now(),sessionId:'debug-session',runId:'run1',hypothesisId:'E'})}).catch(()=>{});
                                // #endregion
                                console.log('[SUBSCRIBE] Rendered HTML length:', rendered.mainHTML ? rendered.mainHTML.length : 0);
                                console.log('[SUBSCRIBE] Rendered HTML preview:', rendered.mainHTML ? rendered.mainHTML.substring(0, 200) : 'null');
                                
                                // Check if display functions are available
                                if (!window.updateMainArea) {
                                    console.error('[SUBSCRIBE] window.updateMainArea is not available!');
                                }
                                if (!window.updateStatusArea) {
                                    console.error('[SUBSCRIBE] window.updateStatusArea is not available!');
                                }
                                if (!window.updateSoftKeyLabels) {
                                    console.error('[SUBSCRIBE] window.updateSoftKeyLabels is not available!');
                                }
                                
                                if (window.updateMainArea) {
                                    console.log('[SUBSCRIBE] Calling updateMainArea...');
                                    window.updateMainArea(rendered.mainHTML);
                                }
                                // Update status area with rendered content first
                                if (window.updateStatusArea) {
                                    window.updateStatusArea(rendered.statusHTML || '');
                                }
                                
                                // Update font size after content is rendered (wait for layout)
                                requestAnimationFrame(() => {
                                    updateLCDFontSize();
                                });
                                
                                // Handle overlay menu for SLM screens
                                if (state.slmSoundSettings?.visible && window.renderScreen) {
                                    const overlayRendered = window.renderScreen('slm_sound_settings_overlay', state);
                                    console.log('[OVERLAY] Rendered HTML:', overlayRendered.mainHTML);
                                    console.log('[OVERLAY] HTML length:', overlayRendered.mainHTML.length);
                                    // Render overlay as a popup box on top of main content
                                    const lcdMain = document.querySelector('.lcd__main');
                                    if (lcdMain) {
                                        // Remove existing overlay if present
                                        const existingOverlay = lcdMain.querySelector('.slm-overlay-menu');
                                        if (existingOverlay) {
                                            existingOverlay.remove();
                                        }
                                        // Create overlay element as a positioned box (not full screen)
                                        const overlayEl = document.createElement('div');
                                        overlayEl.className = 'slm-overlay-menu';
                                        overlayEl.innerHTML = overlayRendered.mainHTML;
                                        // Position as a centered box, stopping just above softkeys
                                        // Get the height of the softkeys area to position above it
                                        const lcdSoftkeys = document.querySelector('.lcd__softkeys');
                                        const softkeysHeight = lcdSoftkeys ? lcdSoftkeys.offsetHeight : 0;
                                        const lcdMainHeight = lcdMain.offsetHeight;
                                        // Center horizontally, position from top, use max-height instead of bottom to prevent clipping
                                        const maxHeight = lcdMainHeight - (lcdMainHeight * 0.1) - softkeysHeight - 10; // 10% from top, space for softkeys, 10px margin
                                        overlayEl.style.cssText = `position: absolute; top: 10%; left: 50%; transform: translateX(-50%); width: 50%; max-height: ${maxHeight}px; background: rgba(29, 35, 43, 1); border: 1px solid rgba(255, 0, 0, 0.5); z-index: 1000; padding: 1.2em 1.5em; overflow-y: auto; overflow-x: hidden;`;
                                        lcdMain.appendChild(overlayEl);
                                        // Keep original SLM softkeys when overlay is visible (don't replace them)
                                        // Get the original SLM screen softkeys
                                        const originalSlmScreen = window.renderScreen ? window.renderScreen(state.viewId, state) : null;
                                        if (window.updateSoftKeyLabels && originalSlmScreen && originalSlmScreen.softkeys) {
                                            // Use the original SLM screen softkeys (glasses, F-S-I, A-C-Z-F, METER 1)
                                            const softkeys = Array.isArray(originalSlmScreen.softkeys) ? originalSlmScreen.softkeys : [];
                                            while (softkeys.length < 4) {
                                                softkeys.push('');
                                            }
                                            window.updateSoftKeyLabels(softkeys.slice(0, 4));
                                        }
                                    }
                                } else {
                                    // Remove overlay if not visible
                                    const lcdMain = document.querySelector('.lcd__main');
                                    if (lcdMain) {
                                        const existingOverlay = lcdMain.querySelector('.slm-overlay-menu');
                                        if (existingOverlay) {
                                            existingOverlay.remove();
                                        }
                                    }
                                    // For view menu, keep original SLM softkeys instead of view menu softkeys
                                    if (state.viewId === "slm_view_menu") {
                                        // Use default SLM home screen softkeys (glasses, F-S-I, A-C-Z-F, METER 1)
                                        // These should match the SLM home screen softkeys
                                        if (window.updateSoftKeyLabels) {
                                            const defaultSlmSoftkeys = [
                                                "<svg width='20' height='12' viewBox='0 0 20 12' xmlns='http://www.w3.org/2000/svg' style='display:inline-block;vertical-align:middle;'><ellipse cx='5' cy='6' rx='3.5' ry='3' fill='none' stroke='currentColor' stroke-width='1.5'/><ellipse cx='15' cy='6' rx='3.5' ry='3' fill='none' stroke='currentColor' stroke-width='1.5'/><line x1='8.5' y1='6' x2='11.5' y2='6' stroke='currentColor' stroke-width='1.5' stroke-linecap='round'/></svg>",
                                                "F-S-I",
                                                "A-C-Z-F",
                                                "METER 1"
                                            ];
                                            window.updateSoftKeyLabels(defaultSlmSoftkeys);
                                        }
                                    } else {
                                        // Restore original softkeys when overlay is closed
                                        if (window.updateSoftKeyLabels) {
                                            window.updateSoftKeyLabels(rendered.softkeys);
                                        }
                                    }
                                }
                            } else {
                                console.error('[SUBSCRIBE] window.renderScreen is not available!');
                            }
                            
                            // Set backlight state
                            if (window.updateDisplayBacklightState) {
                                window.updateDisplayBacklightState(state.backlight);
                            }
                            
                            // Update stop button disabled state based on measurement state
                            const stopButton = document.querySelector('.fn-btn--stop');
                            if (stopButton) {
                                // Disable stop button when measurement is running, enable when paused
                                const measurementState = state.measurement?.state;
                                if (measurementState === 'running') {
                                    stopButton.disabled = true;
                                    stopButton.classList.add('button--disabled');
                                } else if (measurementState === 'paused') {
                                    stopButton.disabled = false;
                                    stopButton.classList.remove('button--disabled');
                                } else {
                                    // Stopped or other states - enable button
                                    stopButton.disabled = false;
                                    stopButton.classList.remove('button--disabled');
                                }
                            }
                            
                            // Render toast if present
                            if (window.renderToast && state.toast) {
                                window.renderToast(state.toast);
                            } else if (window.hideToast) {
                                window.hideToast();
                            }
                        } catch (error) {
                            console.error('[SUBSCRIBE] Error in subscription callback:', error);
                        }
                    });
                }
                
                // Initialize button handlers
                if (window.initButtons) {
                    window.initButtons();
                }
                
                // Trigger initial render after everything is set up
                // The subscription callback should fire automatically, but ensure initial state is rendered
                if (window.getMainFSMState) {
                    const initialState = window.getMainFSMState();
                    // #region agent log
                    fetch('http://127.0.0.1:7242/ingest/d29d041b-3e2f-4de6-8d28-ee7a100756fa',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'index.html:235',message:'initial state check',data:{viewId:initialState.viewId,hasRenderScreen:!!window.renderScreen,hasUpdateMainArea:!!window.updateMainArea},timestamp:Date.now(),sessionId:'debug-session',runId:'run1',hypothesisId:'E'})}).catch(()=>{});
                    // #endregion
                    console.log('[INIT] Initial state viewId:', initialState.viewId);
                    
                    // Manually trigger render for initial state (in case subscription didn't fire)
                    const lcd = document.querySelector('.lcd');
                    if (lcd) {
                        if (initialState.viewId === 'OFF') {
                            lcd.classList.add('lcd--powered-off');
                        } else {
                            lcd.classList.remove('lcd--powered-off');
                        }
                    }
                    
                    if (initialState.viewId !== 'OFF' && window.renderScreen) {
                        // #region agent log
                        fetch('http://127.0.0.1:7242/ingest/d29d041b-3e2f-4de6-8d28-ee7a100756fa',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'index.html:248',message:'initial render calling renderScreen',data:{viewId:initialState.viewId},timestamp:Date.now(),sessionId:'debug-session',runId:'run1',hypothesisId:'E'})}).catch(()=>{});
                        // #endregion
                        const rendered = window.renderScreen(initialState.viewId, initialState);
                        // #region agent log
                        fetch('http://127.0.0.1:7242/ingest/d29d041b-3e2f-4de6-8d28-ee7a100756fa',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:'index.html:250',message:'initial render result',data:{viewId:initialState.viewId,mainHTMLLength:rendered?.mainHTML?.length||0,hasUpdateMainArea:!!window.updateMainArea},timestamp:Date.now(),sessionId:'debug-session',runId:'run1',hypothesisId:'E'})}).catch(()=>{});
                        // #endregion
                        if (window.updateMainArea) window.updateMainArea(rendered.mainHTML);
                        if (window.updateStatusArea) window.updateStatusArea(rendered.statusHTML || '');
                        if (window.updateSoftKeyLabels) window.updateSoftKeyLabels(rendered.softkeys);
                        
                        // Update font size after initial render
                        requestAnimationFrame(() => {

                const targetVisibleWidth = lcdRect.width * 2.2; // Show LCD + buttons with margin
                const targetZoomPercent = Math.min(200, Math.max(50, ((photoRect.width / targetVisibleWidth) - 1) * 100 + 5)); // Add 5% more zoom

                const interactiveAreaCenterY = photoRect.top + (photoRect.height * 0.30); // 30% from top

        // Debug utility to check SPL display text overflow
        function checkSPLDisplayOverflow() {
            const splDisplay = document.querySelector('.screen-element--spl-display');
            if (!splDisplay) {
                console.log('[SPL-DEBUG] No SPL display found');
                return null;
            }
            
            const valueEl = splDisplay.querySelector('.spl-display__value');
            const unitEl = splDisplay.querySelector('.spl-display__unit');
            const container = splDisplay;
            
            if (!valueEl || !unitEl) {
                console.log('[SPL-DEBUG] SPL display elements not found');
                return null;
            }
            
            const containerRect = container.getBoundingClientRect();
            const valueRect = valueEl.getBoundingClientRect();
            const unitRect = unitEl.getBoundingClientRect();
            
            const containerWidth = containerRect.width;
            const valueWidth = valueRect.width;
            const unitWidth = unitRect.width;
            const totalContentWidth = (valueRect.right - valueRect.left) + (unitRect.right - unitRect.left);
            const spacing = unitRect.left - valueRect.right;
            
            const isOverflowing = totalContentWidth > containerWidth;
            const overflowAmount = Math.max(0, totalContentWidth - containerWidth);
            const overflowPercent = (overflowAmount / containerWidth) * 100;
            
            const info = {
                containerWidth: containerWidth.toFixed(2),
                valueWidth: valueWidth.toFixed(2),
                unitWidth: unitWidth.toFixed(2),
                spacing: spacing.toFixed(2),
                totalContentWidth: totalContentWidth.toFixed(2),
                isOverflowing,
                overflowAmount: overflowAmount.toFixed(2),
                overflowPercent: overflowPercent.toFixed(2),
                viewportWidth: window.innerWidth,
                viewportHeight: window.innerHeight,
                lcdBaseFontSize: parseFloat(getComputedStyle(document.querySelector('.lcd')).fontSize) || 0
            };
            
            console.log('[SPL-DEBUG] SPL Display Overflow Check:', info);
            
            if (isOverflowing) {
                console.warn(`[SPL-DEBUG] ⚠️ TEXT IS CUT OFF! Overflow: ${overflowAmount.toFixed(2)}px (${overflowPercent.toFixed(1)}%)`);
            } else {
                console.log(`[SPL-DEBUG] ✅ Text fits within container. Available space: ${(containerWidth - totalContentWidth).toFixed(2)}px`);
            }
            
            // Add visual indicator if overflowing
            if (isOverflowing) {
                splDisplay.style.outline = '2px solid red';
                splDisplay.style.outlineOffset = '2px';
            } else {
                splDisplay.style.outline = '';
            }
            
            return info;

                const offsetY = dosimeterRelativePosition.top - lastSimulatorRect.top;

                updateLCDFontSize();
            }, 100);
        }
    </script>

    <div id="device-stage" role="presentation">
        <div class="dosimeter-container">
            <img
                class="dosimeter-photo"
                src="assets/Quest Sound Dosimeter.png"
                alt="Quest Sound Dosimeter device photograph"
                draggable="true"
            >
            <!-- Dosimeter display overlay -->
            <div class="dosimeter-display testing-overlay" id="dosimeter-display">
                <div class="dosimeter-display__line dosimeter-display__line--top">
                    <span class="dosimeter-display__value">114</span>
                </div>
                <div class="dosimeter-display__line dosimeter-display__line--bottom">
                    <span class="dosimeter-display__frequency">1000</span>
                </div>
            </div>
            <!-- Dosimeter power button overlay -->
            <button class="dosimeter-btn dosimeter-btn--power testing-overlay" type="button" aria-label="Dosimeter Power"></button>
        </div>
        <div class="device-frame" aria-label="Quest SoundPro SE-DL device" role="img">
            <img
                class="device-photo"
                src="assets/Quest Sound Meter.png"
                alt="Quest SoundPro SE-DL device photograph serving as the full device face"
                draggable="false"
            >

            <!-- Absolute overlay layer anchored to the device photo -->
            <div class="overlay-layer">
                <!-- LCD overlay region -->
                <section class="lcd lcd--powered-off testing-overlay" aria-label="LCD display" aria-live="polite">
                    <div class="lcd__status"></div>
                    <div class="lcd__main"></div>
                    <div class="lcd__softkeys"></div>
                </section>

                <!-- Soft keys 1–4 (top to bottom or left to right depending on device) -->
                <button class="soft-key soft-key--1 testing-overlay" type="button" aria-label="Soft Key 1"></button>
                <button class="soft-key soft-key--2 testing-overlay" type="button" aria-label="Soft Key 2"></button>
                <button class="soft-key soft-key--3 testing-overlay" type="button" aria-label="Soft Key 3"></button>
                <button class="soft-key soft-key--4 testing-overlay" type="button" aria-label="Soft Key 4"></button>

                <!-- Navigation buttons: Up/Down/Left/Right/Enter -->
                <button class="nav__btn nav__btn--up testing-overlay" type="button" aria-label="Up"></button>
                <button class="nav__btn nav__btn--down testing-overlay" type="button" aria-label="Down"></button>
                <button class="nav__btn nav__btn--left testing-overlay" type="button" aria-label="Left"></button>
                <button class="nav__btn nav__btn--right testing-overlay" type="button" aria-label="Right"></button>
                <button class="nav__btn nav__btn--enter testing-overlay" type="button" aria-label="Enter"></button>

                <!-- Function buttons: Alt f, Backlight, Run/Pause, Stop, On/Off -->
                <button class="fn-btn fn-btn--altf testing-overlay" type="button" aria-label="Alt f"></button>
                <button class="fn-btn fn-btn--backlight testing-overlay" type="button" aria-label="Backlight"></button>
                <button class="fn-btn fn-btn--runpause testing-overlay" type="button" aria-label="Run or Pause"></button>
                <button class="fn-btn fn-btn--stop testing-overlay" type="button" aria-label="Stop"></button>
                <button class="fn-btn fn-btn--power testing-overlay" type="button" aria-label="On Off"></button>

                <!-- Dialog overlay (hidden by default) -->
                <div id="dialog-overlay" class="dialog-overlay" aria-hidden="true" role="dialog" aria-modal="true">
                    <div class="dialog" role="document">
                        <header class="dialog__header">
                            <h2 class="dialog__title">Notice</h2>
                        </header>
                        <div class="dialog__body">
                            <p>Dialog content goes here.</p>
                        </div>
                        <footer class="dialog__footer">
                            <button class="dialog__btn dialog__btn--confirm" type="button">OK</button>
                            <button class="dialog__btn dialog__btn--cancel" type="button">Cancel</button>
                        </footer>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
