<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest SoundPro SE-DL Simulation</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="device-stage" role="presentation">
        <div class="device-frame" aria-label="Quest SoundPro SE-DL device" role="img">
            <img
                class="device-photo"
                src="assets/Quest Sound Meter.png"
                alt="Quest SoundPro SE-DL device photograph serving as the full device face"
                draggable="false"
            >

            <!-- Absolute overlay layer anchored to the device photo -->
            <div class="overlay-layer">
                <!-- LCD overlay region -->
                <section class="lcd lcd--powered-off testing-overlay" aria-label="LCD display" aria-live="polite">
                    <div class="lcd__status"></div>
                    <div class="lcd__main"></div>
                    <div class="lcd__softkeys"></div>
                </section>

                <!-- Soft keys 1–4 (top to bottom or left to right depending on device) -->
                <button class="soft-key soft-key--1 testing-overlay" type="button" aria-label="Soft Key 1"></button>
                <button class="soft-key soft-key--2 testing-overlay" type="button" aria-label="Soft Key 2"></button>
                <button class="soft-key soft-key--3 testing-overlay" type="button" aria-label="Soft Key 3"></button>
                <button class="soft-key soft-key--4 testing-overlay" type="button" aria-label="Soft Key 4"></button>

                <!-- Navigation buttons: Up/Down/Left/Right/Enter -->
                <button class="nav__btn nav__btn--up testing-overlay" type="button" aria-label="Up"></button>
                <button class="nav__btn nav__btn--down testing-overlay" type="button" aria-label="Down"></button>
                <button class="nav__btn nav__btn--left testing-overlay" type="button" aria-label="Left"></button>
                <button class="nav__btn nav__btn--right testing-overlay" type="button" aria-label="Right"></button>
                <button class="nav__btn nav__btn--enter testing-overlay" type="button" aria-label="Enter"></button>

                <!-- Function buttons: Alt f, Backlight, Run/Pause, Stop, On/Off -->
                <button class="fn-btn fn-btn--altf testing-overlay" type="button" aria-label="Alt f"></button>
                <button class="fn-btn fn-btn--backlight testing-overlay" type="button" aria-label="Backlight"></button>
                <button class="fn-btn fn-btn--runpause testing-overlay" type="button" aria-label="Run or Pause"></button>
                <button class="fn-btn fn-btn--stop testing-overlay" type="button" aria-label="Stop"></button>
                <button class="fn-btn fn-btn--power testing-overlay" type="button" aria-label="On Off"></button>

                <!-- Dialog overlay (hidden by default) -->
                <div id="dialog-overlay" class="dialog-overlay" aria-hidden="true" role="dialog" aria-modal="true">
                    <div class="dialog" role="document">
                        <header class="dialog__header">
                            <h2 class="dialog__title">Notice</h2>
                        </header>
                        <div class="dialog__body">
                            <p>Dialog content goes here.</p>
                        </div>
                        <footer class="dialog__footer">
                            <button class="dialog__btn dialog__btn--confirm" type="button">OK</button>
                            <button class="dialog__btn dialog__btn--cancel" type="button">Cancel</button>
                        </footer>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Core modules (Task 2.0) -->
    <script src="js/utils.js"></script>
    <script src="js/device.js"></script>
    <script src="js/display.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/buttons.js"></script>
    
    <!-- Development/debugging scripts -->
    <script src="js/measure-photo.js"></script>
    <script src="js/viewport-size-indicator.js"></script>
    <script src="js/fix-percentages.js"></script>
    <script src="js/recalculate-percentages.js"></script>
    <script src="js/debug-positioning.js"></script>
    
    <!-- Initialize application -->
    <script>
        // Initialize button handlers when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                if (window.initButtons) {
                    window.initButtons();
                }
            });
        } else {
            if (window.initButtons) {
                window.initButtons();
            }
        }
    </script>
</body>
</html>
